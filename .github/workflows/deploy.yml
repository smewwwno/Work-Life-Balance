name: Deploy Personal OS

on:
  push:
    branches: [claude/personal-os-architecture-tCBIu]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Change expired root password
        run: |
          sudo apt-get install -y expect sshpass
          /usr/bin/expect << 'EXPECT'
          set timeout 30
          spawn sshpass -p "$env(SERVER_PASSWORD)" ssh \
            -o StrictHostKeyChecking=no \
            -o NumberOfPasswordPrompts=1 \
            root@$env(SERVER_HOST)
          expect {
            "Current password:" {
              send "$env(SERVER_PASSWORD)\r"
              expect "New password:"
              send "$env(SERVER_PASSWORD_NEW)\r"
              expect "Retype new password:"
              send "$env(SERVER_PASSWORD_NEW)\r"
              expect "$ "
              send "exit\r"
            }
            "$ " {
              send "exit\r"
            }
          }
          expect eof
          EXPECT
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PASSWORD_NEW: ${{ secrets.SERVER_PASSWORD_NEW }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD_NEW }}
          script: |
            set -e

            # Node.js 22
            if ! node --version 2>/dev/null | grep -q "v2[2-9]"; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
            fi

            # Clone or update repo
            if [ -d /root/personal-os ]; then
              cd /root/personal-os && git pull origin claude/personal-os-architecture-tCBIu
            else
              git clone --branch claude/personal-os-architecture-tCBIu \
                https://github.com/smewwwno/Work-Life-Balance /root/personal-os
            fi

            # Build React app
            cd /root/personal-os/application
            npm install
            npm run build

            # Install pm2 + serve if needed
            npm list -g pm2 2>/dev/null || npm install -g pm2
            npm list -g serve 2>/dev/null || npm install -g serve

            # Deploy
            pm2 stop personal-os 2>/dev/null || true
            pm2 start "serve -s dist -l 80" --name personal-os
            pm2 save

            echo "Deployed at http://${{ secrets.SERVER_HOST }}"
